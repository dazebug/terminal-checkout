<!DOCTYPE html>
<!-- `lang` is the resolved tag itself rather than a translated string, so it is written by the
     application path (`applyDocumentLanguage` in i18n.js) and not looked up in a dictionary. It
     stays `en` in the markup because that is the truth until options.js initializes: current i18n
     resolves Chrome's chosen catalogue, while the compatibility seed gives an adjacent old i18n
     implementation the same tag it would resolve from Chrome's UI language. Assistive technology
     and hyphenation read this attribute, so the call site lands with the first synchronous paint. -->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <!-- The product name is permanent text; the word after it is a message, filled by options.js as
       soon as it runs (a document title has no `data-i18n` node to carry it). -->
  <title>Terminal Checkout</title>
  <style>
    /* Palette and typography use the same tokens as the app settings window (app/Sources/App/Theme.swift) — change one, change the other */
    :root {
      --bg: #14161C;
      --panel: #1B1E26;
      --chip: #0E1014;
      --border: #2A2F3A;
      --text: #DEE3EC;
      --dim: #8B93A3;
      --faint: #6B7484;
      --ok: #4EC97B;
      --warn: #E0B14E;
      --err: #E06C75;
      --accent: #56C2DC;
      --action: #238636;
      --action-hover: #2ea043;
      --mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, monospace;
      --ui: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: var(--ui);
      font-size: 13px;
      background: var(--bg);
      color: var(--text);
      padding: 36px 28px 56px;
      max-width: 760px;
      margin: 0 auto;
    }
    .prompt { color: var(--accent); }

    /* Header: the same prompt and blinking cursor as the app settings window */
    .term-header { margin-bottom: 36px; }
    .term-title { font: 600 19px/1.3 var(--mono); letter-spacing: -0.2px; }
    .term-title .cursor { color: var(--accent); margin-left: 3px; animation: blink 1.1s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0.12; } }
    @media (prefers-reduced-motion: reduce) { .term-title .cursor { animation: none; } }
    .term-sub { margin-top: 7px; color: var(--faint); font: 11px var(--mono); }

    .section { margin-bottom: 40px; }
    .section-prompt { font: 600 14px var(--mono); margin-bottom: 8px; }
    .section-where { font: 400 12px var(--ui); color: var(--faint); }
    .help { font-size: 12px; color: var(--dim); margin-bottom: 8px; line-height: 1.65; }
    .faint { color: var(--faint); }
    code {
      font: 11px var(--mono);
      color: var(--accent);
      background: var(--chip);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 1px 5px;
    }

    label { display: block; font: 10px var(--mono); letter-spacing: 0.6px; color: var(--faint); margin-bottom: 4px; }
    input, select, textarea {
      background: var(--chip);
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 6px;
      padding: 6px 9px;
      font: 12px var(--mono);
      outline: none;
    }
    input:focus, select:focus, textarea:focus { border-color: var(--accent); }

    /* Button cards */
    .btn-card {
      position: relative; /* anchor for the drop indicator line */
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 16px;
      margin-bottom: 12px;
    }
    .btn-card.dragging,
    .claude-row.dragging { opacity: 0.4; }
    /* Shows where a dropped card would land, as a line in the 12px gap between cards */
    .btn-card.drop-before::before,
    .btn-card.drop-after::after,
    .claude-row.drop-before::before,
    .claude-row.drop-after::after {
      content: "";
      position: absolute;
      left: 0;
      right: 0;
      height: 2px;
      background: var(--accent);
      border-radius: 2px;
    }
    .btn-card.drop-before::before { top: -7px; }
    .btn-card.drop-after::after { bottom: -7px; }
    /* The row indicator sits in the 7px gap between rows, so its offsets are smaller. */
    .claude-row.drop-before::before { top: -4px; }
    .claude-row.drop-after::after { bottom: -4px; }

    .btn-card-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
    .btn-number { display: inline-flex; align-items: center; gap: 5px; font: 600 12.5px var(--mono); }
    .drag-handle,
    .ci-drag-handle {
      background: transparent;
      border: none;
      color: var(--faint);
      font-size: 13px;
      line-height: 1;
      padding: 2px 4px;
      border-radius: 4px;
      cursor: grab;
    }
    .drag-handle:hover,
    .ci-drag-handle:hover { color: var(--text); background: var(--chip); }
    .drag-handle:active,
    .ci-drag-handle:active { cursor: grabbing; }
    .ci-drag-handle { font-size: 11px; }

    .card-actions { display: flex; align-items: center; gap: 2px; }
    .remove-btn, .duplicate-btn {
      background: transparent;
      border: 1px solid transparent;
      color: var(--faint);
      border-radius: 6px;
      padding: 3px 9px;
      font: 11px var(--mono);
      cursor: pointer;
    }
    .duplicate-btn:hover { color: var(--accent); border-color: rgba(86, 194, 220, 0.4); }
    .remove-btn:hover { color: var(--err); border-color: rgba(224, 108, 117, 0.4); }

    .btn-row { display: flex; gap: 10px; margin-bottom: 12px; align-items: flex-end; }
    .field { display: flex; flex-direction: column; }
    .field-face .face-input { width: 84px; text-align: center; }
    .field-label { flex: 1; }
    .field-label .label-input { width: 100%; }
    .field-preset .preset-select { width: 170px; }

    /* Face preview — paired with the PR button display rules in content.js (color, shape, size);
       change one, change the other. The layout negotiation with the GitHub row (flex-shrink and
       friends) is not paired — .field is a column flex container, so the axis differs */
    .field-preview { justify-content: flex-end; }
    .face-preview { display: inline-flex; align-items: center; height: 29px; }
    .face-preview.gh-btn-emoji { color: #57ab5a; font-size: 14px; padding: 4px; }
    .face-preview.gh-btn-text {
      color: #57ab5a;
      border: 1px solid rgba(87, 171, 90, 0.45);
      border-radius: 2em;
      padding: 2px 8px;
      height: auto;
      max-width: 120px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      display: inline-block;
      font: 600 11px/1.6 var(--mono);
    }

    /* Repository buttons are GitHub's green header action button — paired with REPO_BUTTON_STYLE in content.js */
    .face-preview.gh-btn-header {
      background: var(--action);
      color: #fff;
      border-radius: 6px;
      padding: 3px 8px;
      height: auto;
      max-width: 200px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      display: inline-block;
      font: 500 11px/1.55 var(--ui);
    }

    /* Face emoji palette: clicking one appends it to the face field */
    .face-palette { display: flex; align-items: center; gap: 2px; margin: -4px 0 12px; }
    .palette-label { font: 10px var(--mono); letter-spacing: 0.6px; color: var(--faint); margin-right: 6px; }
    .palette-btn {
      background: transparent;
      border: 1px solid transparent;
      border-radius: 6px;
      padding: 2px 5px;
      font-size: 14px;
      cursor: pointer;
    }
    .palette-btn:hover { background: var(--chip); border-color: var(--border); }

    /* command: a shell block with a $ prompt */
    .cmd-block {
      display: flex;
      gap: 8px;
      background: var(--chip);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 8px 10px;
    }
    .cmd-block:focus-within { border-color: var(--accent); }
    .cmd-prompt { color: var(--faint); font: 12px/1.55 var(--mono); user-select: none; }
    .command-input {
      flex: 1;
      background: transparent;
      border: none;
      border-radius: 0;
      padding: 0;
      font: 12px/1.55 var(--mono);
      resize: vertical;
      min-height: 3.1em;
    }

    /* claude input queue: the inputs handed, in order, to the claude session the command starts */
    .claude-queue { margin-top: 14px; border-top: 1px dashed var(--border); padding-top: 12px; }
    .claude-queue-head { font: 600 11.5px var(--mono); color: var(--dim); margin-bottom: 9px; }
    .claude-queue-head .ret { color: var(--accent); }
    .help-inline { font: 400 11px var(--ui); color: var(--faint); }
    .claude-hint { font: 11px/1.6 var(--ui); color: var(--faint); margin: 0 0 9px 32px; }
    .claude-warn { font: 11px var(--ui); color: var(--warn); margin: 0 0 9px 32px; }
    .claude-row {
      position: relative; /* anchor for the row drop indicator line */
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 7px;
    }
    .ci-marker { font: 11px var(--mono); color: var(--faint); width: 24px; text-align: right; flex: none; }
    .ci-input { flex: 1; }
    .ci-remove {
      background: transparent;
      border: none;
      color: var(--faint);
      font-size: 14px;
      cursor: pointer;
      padding: 2px 6px;
      border-radius: 4px;
    }
    .ci-remove:hover { color: var(--err); }
    .add-input-btn {
      background: transparent;
      border: 1px dashed var(--border);
      color: var(--dim);
      border-radius: 6px;
      padding: 4px 10px;
      font: 11px var(--mono);
      cursor: pointer;
      margin-left: 32px;
    }
    .add-input-btn:hover:not(:disabled) { color: var(--text); border-color: var(--dim); }
    .add-input-btn:disabled { opacity: 0.4; cursor: not-allowed; }

    /* Repository override table */
    .override-table { width: 100%; border-collapse: collapse; }
    .override-table th {
      text-align: left;
      font: 10px var(--mono);
      letter-spacing: 0.6px;
      color: var(--faint);
      padding: 6px 8px;
      border-bottom: 1px solid var(--border);
    }
    .override-table td { padding: 5px 8px 5px 0; }
    .override-table td:first-child { padding-left: 0; }
    .override-table input { width: 100%; }
    .override-table .remove-row {
      background: transparent;
      border: none;
      color: var(--faint);
      cursor: pointer;
      font-size: 15px;
      padding: 4px;
    }
    .override-table .remove-row:hover { color: var(--err); }
    .override-empty { font-size: 12px; color: var(--faint); padding: 8px 0; }

    /* Actions */
    .actions {
      display: flex;
      gap: 10px;
      align-items: center;
      margin-top: 8px;
      padding-top: 20px;
      border-top: 1px solid var(--border);
    }
    #dirty-indicator { color: var(--warn); font: 11px var(--mono); margin-left: 4px; }
    .add-hint { font-size: 12px; color: var(--faint); margin-left: 8px; }

    /* Update notice. The badge sits in the header and appears only when the saved settings were
       written against an older generation of the presets; the panel opens from it. */
    #migration-badge {
      margin-top: 10px; padding: 5px 11px; border-radius: 6px; cursor: pointer;
      background: rgba(224, 177, 78, 0.12); border: 1px solid rgba(224, 177, 78, 0.45);
      color: var(--warn); font: 600 11px var(--mono);
    }
    #migration-badge:hover { background: rgba(224, 177, 78, 0.2); }
    #stale-banner {
      margin-top: 10px; padding: 8px 11px; border-radius: 6px;
      background: rgba(224, 108, 117, 0.1); border: 1px solid rgba(224, 108, 117, 0.4);
      color: var(--err); font: 11px/1.6 var(--mono);
    }
    .mig-effect {
      font: 10px var(--mono); padding: 1px 6px; border-radius: 999px;
      border: 1px solid rgba(224, 177, 78, 0.5); color: var(--warn);
    }
    .mig-why { margin: 4px 0 0 22px; font-size: 11px; color: var(--dim); line-height: 1.6; }
    .mig-item { border-top: 1px solid var(--border); padding: 10px 0; }
    .mig-item:first-child { border-top: none; }
    .mig-head { display: flex; align-items: center; gap: 8px; font: 12px var(--ui); color: var(--text); }
    .mig-where { color: var(--faint); font: 11px var(--mono); }
    .mig-source { font: 10px var(--mono); padding: 1px 6px; border-radius: 999px; border: 1px solid var(--border); color: var(--dim); }
    .mig-diff { margin: 6px 0 0 22px; font: 11px/1.7 var(--mono); word-break: break-all; }
    .mig-from { color: var(--err); }
    .mig-to { color: var(--ok); }
    .mig-note { margin: 4px 0 0 22px; font-size: 11px; color: var(--faint); line-height: 1.6; }
    .btn-primary {
      background: var(--action);
      color: #fff;
      border: none;
      border-radius: 6px;
      padding: 8px 18px;
      font: 600 12.5px var(--mono);
      cursor: pointer;
    }
    .btn-primary:hover { background: var(--action-hover); }
    .btn-secondary {
      background: var(--panel);
      color: var(--dim);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 8px 14px;
      font: 12px var(--mono);
      cursor: pointer;
    }
    .btn-secondary:hover:not(:disabled) { color: var(--text); border-color: var(--dim); }
    .btn-secondary:disabled { opacity: 0.5; cursor: not-allowed; }

    /* Status: styled like a line of terminal output */
    #load-error { margin-top: 14px; }
    .status { display: none; font: 12px var(--mono); margin-top: 14px; padding: 8px 12px; border-radius: 6px; }
    .status.success { display: block; color: var(--ok); background: rgba(78, 201, 123, 0.08); }
    .status.success::before { content: "✓ "; }
    .status.error { display: block; color: var(--err); background: rgba(224, 108, 117, 0.08); }
    .status.error::before { content: "✗ "; }
    .status.info { display: block; color: var(--accent); background: rgba(86, 194, 220, 0.08); }

    @media (max-width: 560px) {
      .btn-row { flex-wrap: wrap; }
      .field-label { flex-basis: 100%; }
    }
  </style>
</head>
<body>
  <!-- Everything the user can act on lives inside #app, which is inert until the settings have
       been read. The status line and [Retry] below are deliberately outside it: a load that fails
       still has to be able to say so and offer a way back. -->
  <main id="app" inert>
  <header class="term-header">
    <h1 class="term-title"><span class="prompt">❯</span> terminal-checkout · <span data-i18n="ext.header.options"></span><span class="cursor">▊</span></h1>
    <p class="term-sub" data-i18n="ext.header.subtitle"></p>
    <button id="migration-badge" hidden data-i18n="ext.migration.badge"></button>
    <!-- Raised as soon as another device's change arrives, so the warning is on screen before Save is
         pressed. Save re-reads and decides for itself: a change event can be missed, and a banner
         that never appeared must not be read as "nothing changed". -->
    <p id="stale-banner" hidden data-i18n="ext.banner.stale"></p>
  </header>

  <!-- Shown only when the stored settings were reviewed against an older generation of the presets.
       Applying fills the edit state and leaves the write to the same Save button as everything
       else — nothing here touches storage on its own. -->
  <section class="section" id="migration-section" hidden>
    <h2 class="section-prompt"><span class="prompt">❯</span> <span data-i18n="ext.section.update.title"></span></h2>
    <p class="help" id="migration-describe"></p>
    <div id="migration-actionable"></div>
    <div id="migration-informational"></div>
    <div style="margin-top:12px">
      <button class="btn-primary" id="migration-apply" data-i18n="ext.migration.apply"></button>
      <button class="btn-secondary" id="migration-keep" data-i18n="ext.migration.keep"></button>
      <span class="add-hint" id="migration-hint"></span>
    </div>
  </section>

  <section class="section">
    <h2 class="section-prompt"><span class="prompt">❯</span> <span data-i18n="ext.section.pr.title"></span></h2>
    <p class="help" data-i18n="ext.section.pr.help1"></p>
    <p class="help" data-i18n="ext.section.pr.help2"></p>
    <p class="help" data-i18n="ext.section.pr.variables"></p>
    <p class="help" data-i18n="ext.section.pr.migrationHelp"></p>
    <div id="pr-buttons"></div>
    <div style="margin-top:10px">
      <button class="btn-secondary" id="pr-add" data-i18n="ext.button.addButton"></button>
      <span class="add-hint" id="pr-add-hint" hidden data-i18n="ext.button.addLimit"></span>
    </div>
  </section>

  <section class="section">
    <h2 class="section-prompt"><span class="prompt">❯</span> <span data-i18n="ext.section.issue.title"></span></h2>
    <p class="help" data-i18n="ext.section.issue.help"></p>
    <p class="help" data-i18n="ext.section.issue.variables"></p>
    <p class="help" data-i18n="ext.section.issue.claudeHelp"></p>
    <div id="issue-buttons"></div>
    <div style="margin-top:10px">
      <button class="btn-secondary" id="issue-add" data-i18n="ext.button.addButton"></button>
      <span class="add-hint" id="issue-add-hint" hidden data-i18n="ext.button.addLimit"></span>
    </div>
  </section>

  <section class="section">
    <h2 class="section-prompt"><span class="prompt">❯</span> <span data-i18n="ext.section.repo.title"></span></h2>
    <p class="help" data-i18n="ext.section.repo.help"></p>
    <p class="help" data-i18n="ext.section.repo.variables"></p>
    <div id="repo-buttons"></div>
    <div style="margin-top:10px">
      <button class="btn-secondary" id="repo-add" data-i18n="ext.button.addButton"></button>
      <span class="add-hint" id="repo-add-hint" hidden data-i18n="ext.button.addLimit"></span>
    </div>
  </section>

  <section class="section">
    <h2 class="section-prompt"><span class="prompt">❯</span> <span data-i18n="ext.section.main.title"></span></h2>
    <p class="help" data-i18n="ext.section.main.help"></p>
    <label for="default-main" data-i18n="ext.field.defaultMain"></label>
    <input type="text" id="default-main" placeholder="main" style="width:200px; margin-bottom:18px">
    <table class="override-table">
      <thead>
        <tr>
          <th style="width:45%" data-i18n="ext.table.repository"></th>
          <th style="width:45%" data-i18n="ext.table.mainBranch"></th>
          <th style="width:10%"></th>
        </tr>
      </thead>
      <tbody id="overrides-body"></tbody>
    </table>
    <div class="override-empty" id="overrides-empty" hidden data-i18n="ext.override.empty"></div>
    <button class="btn-secondary" id="add-override" style="margin-top:8px" data-i18n="ext.button.addOverride"></button>
  </section>

  <section class="section">
    <h2 class="section-prompt"><span class="prompt">❯</span> <span data-i18n="ext.section.backup.title"></span></h2>
    <p class="help" data-i18n="ext.section.backup.help1"></p>
    <p class="help" data-i18n="ext.section.backup.help2"></p>
    <p class="help" data-i18n="ext.section.backup.help3"></p>
    <div style="display:flex; gap:10px; margin-top:10px">
      <button class="btn-secondary" id="export-btn" data-i18n="ext.button.export"></button>
      <button class="btn-secondary" id="import-btn" data-i18n="ext.button.import"></button>
      <input type="file" id="import-file" accept="application/json,.json" hidden>
    </div>
  </section>

  <div class="actions">
    <button class="btn-primary" id="save-btn" data-i18n="ext.button.save"></button>
    <button class="btn-secondary" id="reset-btn" data-i18n="ext.button.reset"></button>
    <span id="dirty-indicator" hidden data-i18n="ext.status.unsaved"></span>
  </div>
  </main>

  <div id="load-error" hidden>
    <button class="btn-secondary" id="retry-btn" data-i18n="ext.button.retry"></button>
  </div>
  <div id="status" class="status"></div>

  <script src="i18n.js"></script>
  <script src="defaults.js"></script>
  <script src="migrations.js"></script>
  <script src="options.js"></script>
</body>
</html>
