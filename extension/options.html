<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Terminal Checkout</title>
  <style>
    /* These app palette tokens mirror app/Sources/App/Theme.swift. GitHub replica colors use the separate --gh-* palette in options-replica.css. */
    :root {
      --bg: #14161C;
      --panel: #1B1E26;
      --chip: #0E1014;
      --border: #2A2F3A;
      --text: #DEE3EC;
      --dim: #8B93A3;
      --faint: #6B7484;
      --ok: #4EC97B;
      --warn: #E0B14E;
      --err: #E06C75;
      --accent: #56C2DC;
      --action: #238636;
      --mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, monospace;
      --ui: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    }
    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    :lang(ko) { word-break: keep-all; overflow-wrap: anywhere; }
    body {
      margin: 0 auto;
      padding: 28px 24px 48px;
      background: var(--bg);
      color: var(--text);
      font: 13px var(--ui);
    }
    button, input, select, textarea { font: inherit; }
    button { cursor: pointer; }
    button:disabled { cursor: not-allowed; }
    input, select, textarea {
      background: var(--chip);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text);
      padding: 6px 9px;
      outline: none;
    }
    input:focus, select:focus, textarea:focus { border-color: var(--accent); }
    label { color: var(--faint); }
    .section { margin-bottom: 18px; }
    .section-prompt { margin-bottom: 8px; font: 600 14px var(--mono); }
    .help { margin-bottom: 8px; color: var(--dim); font-size: 12px; line-height: 1.65; }
    .override-table { width: 100%; border-collapse: collapse; }
    .override-table th { padding: 6px 8px; color: var(--faint); font: 10px var(--mono); text-align: left; }
    .override-table td { padding: 5px 8px 5px 0; }
    .override-table td:first-child { padding-left: 0; }
    .override-table input { width: 100%; }
    .override-empty { padding: 8px 0; color: var(--faint); font-size: 12px; }
    .btn-primary, .btn-secondary {
      padding: 7px 13px;
      border-radius: 6px;
      font: 11px var(--mono);
      transition: all 0.15s;
    }
    .btn-primary { border: 1px solid var(--action); background: var(--action); color: #fff; }
    .btn-primary:hover:not(:disabled) { filter: brightness(1.12); }
    .btn-secondary { border: 1px solid var(--border); background: transparent; color: var(--dim); }
    .btn-secondary:hover:not(:disabled) { border-color: var(--dim); color: var(--text); }
    .btn-primary:disabled, .btn-secondary:disabled { opacity: 0.5; }
  </style>
  <link rel="stylesheet" href="options-shell.css">
  <link rel="stylesheet" href="options-replica.css">
  <link rel="stylesheet" href="options-editor.css">
</head>
<body>
  <div id="options-shell-root"></div>
  <main id="app" inert>
    <div id="options-replica-root"></div>
    <div id="options-editor-root"></div>
  </main>
  <script src="i18n.js"></script>
  <script src="defaults.js"></script>
  <script src="migrations.js"></script>
  <script src="options-shell.js"></script>
  <script src="options-replica.js"></script>
  <script src="options-editor.js"></script>
  <script src="options.js"></script>
</body>
</html>
